plugins { id 'com.android.application' }
android {
 namespace 'app.heroes.finance'
 compileSdk 35
 buildFeatures { buildConfig true }
 signingConfigs {
  release {
   if (System.getenv('HEROES_KEYSTORE_PASSWORD')) {
    storeFile file('heroes-release.jks'); storePassword System.getenv('HEROES_KEYSTORE_PASSWORD'); keyAlias 'heroes'; keyPassword System.getenv('HEROES_KEYSTORE_PASSWORD')
   }
  }
 }
 buildTypes { release { signingConfig signingConfigs.release; minifyEnabled false } }
 defaultConfig { applicationId 'app.heroes.finance'; minSdk 26; targetSdk 35; versionCode 11; versionName '1.4.6' }
 compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
dependencies {
 implementation platform('org.jetbrains.kotlin:kotlin-bom:1.8.22')
 implementation 'androidx.fragment:fragment:1.8.5'
 implementation 'androidx.biometric:biometric:1.1.0'
 implementation 'androidx.webkit:webkit:1.12.1'
 implementation 'androidx.core:core:1.15.0'
}

