  <!-- Mirrored Octopus Character -->
  <use href="#octopus-half" />
  <use href="#octopus-half" transform="scale(-1, 1) translate(-512, 0)" />

  <!-- Left Inner Tentacle Line Accents -->
  <g stroke="#000000" stroke-width="4.5" stroke-linecap="round" fill="none">
    <path d="M 108 116 C 100 130, 108 146, 126 142" />
    <path d="M 46 278 C 50 296, 76 302, 98 290" />
